<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1F3A" />
    <title>CalaSign · Sin conexión</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f4f6fa; color: #0f172a;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding: 16px; box-sizing: border-box; }
      main { background: #fff; border-radius: 12px; padding: 28px 24px; max-width: 420px; width: 100%; box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08); text-align: center; }
      img { width: 56px; height: 56px; }
      h1 { font-size: 1.3rem; margin: 14px 0 8px; }
      p { color: #5b6576; line-height: 1.5; margin: 6px 0; }
      a { display: inline-block; margin-top: 16px; background: #0b1f3a; color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; }
      a:focus-visible { outline: 3px solid #0d9488; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="CalaSign" />
      <h1>Sin conexión</h1>
      <p>No hay conexión a internet. Cuando vuelva, recargá la página: nada de lo que firmaste se pierde.</p>
      <p lang="pt-BR">Sem conexão. Quando voltar, recarregue a página.</p>
      <p lang="en">You're offline. Reload the page when you're back online.</p>
      <a href="">Reintentar · Tentar de novo · Retry</a>
    </main>
  </body>
</html>
