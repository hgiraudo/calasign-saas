# Drop-in de systemd para caddy.service (lo instala scripts/deploy-dev.sh en
# /etc/systemd/system/caddy.service.d/calasign.conf; bootstrap.sh ya lo trae en la unidad).
# - RuntimeDirectory: /run/caddy (del usuario caddy, 0750) para el socket de la API admin (ver el Caddyfile). Se crea
#   al arrancar el servicio y se borra al pararlo.
# - ExecReload: `caddy reload` toma la dirección admin del Caddyfile nuevo; se fija la del socket para que no dependa
#   de eso. --force recarga aunque el archivo no haya cambiado: descarta cualquier config cargada en memoria por la API.
# - Type=notify: Caddy avisa a systemd cuando terminó de cargar la config. Con el Type=simple por defecto, restart
#   volvía enseguida e is-active daba "active" aunque Caddy muriera un instante después al leer un Caddyfile malo,
#   así que deploy-dev.sh no restauraba el anterior.
[Service]
Type=notify
RuntimeDirectory=caddy
RuntimeDirectoryMode=0750
ExecReload=
ExecReload=/usr/local/bin/caddy reload --config /etc/caddy/Caddyfile --address unix//run/caddy/admin.sock --force
