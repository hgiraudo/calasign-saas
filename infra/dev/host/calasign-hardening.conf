# Drop-in de systemd para calasign.service (lo instala scripts/deploy-dev.sh en
# /etc/systemd/system/calasign.service.d/hardening.conf). Complementa NoNewPrivileges/ProtectSystem/PrivateTmp
# de la unidad base. La app solo escribe en /var/lib/calasign (DATA_DIR y su HOME) y en /tmp privado: el resto del
# sistema, incluido su propio código en /opt/calasign, queda de solo lectura (una app comprometida no puede
# modificarse para persistir entre reinicios).
[Service]
ProtectSystem=strict
ReadWritePaths=/var/lib/calasign
UMask=0077
ProtectHome=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
RestrictSUIDSGID=true
RestrictNamespaces=true
RestrictRealtime=true
LockPersonality=true
SystemCallArchitectures=native
CapabilityBoundingSet=
AmbientCapabilities=
# Sin RestrictAddressFamilies: la app necesita AF_UNIX (Postgres por socket) y os.networkInterfaces() usa AF_NETLINK.
# Al socket admin de Caddy (/run/caddy/admin.sock, AF_UNIX) no llega por sus permisos (usuario caddy, /run/caddy 0750),
# no por la familia de direcciones.
# Memoria (t4g.small, 2 GiB, compartidos con Postgres y Caddy): por encima de MemoryHigh el kernel recupera memoria y
# frena el proceso; en MemoryMax lo mata el OOM y systemd lo reinicia (Restart=always). El heap de V8 se topa por
# debajo para que Node falle con un error propio (y libere con GC antes) en vez de crecer hasta el OOM del cgroup.
MemoryHigh=1G
MemoryMax=1300M
Environment=NODE_OPTIONS=--max-old-space-size=1024
