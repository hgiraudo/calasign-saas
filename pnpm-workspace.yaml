packages:
  - apps/*
  - packages/*
  - integrations

# Scripts de instalación (pre/post-install, node-gyp): solo los paquetes de "pnpm.onlyBuiltDependencies" del
# package.json raíz (pnpm 9, el de packageManager, no lee esa opción de este archivo). Cualquier dependencia nueva que
# traiga uno queda bloqueada hasta revisarla y agregarla allá.
#  - esbuild: el postinstall valida/instala el binario de la plataforma (vite, tsx e integrations lo usan).
#  - pkcs11js: módulo nativo (node-gyp) del Firmador para tokens PKCS#11; dependencia opcional, si no compila el
#    Firmador sigue funcionando sin soporte de token.
